name: plant-cadd-minimal
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.3.3
  - pyarrow=23.0.1
  - scipy=1.15.3
  - scikit-learn=1.7.2
  - biopython>=1.81
  - tqdm>=4.65
  - joblib>=1.3
  - xgboost=3.2.0
  - pyyaml=6.0.3
  - python-duckdb=1.5.3
  - pyfaidx>=0.7
  - pysam>=0.21
  - pybedtools>=0.9
  - bedtools>=2.31
  - pytorch>=2.0
  - transformers>=4.30
  - pytest>=7.0
  - click>=8.1
  - pip
  - pip:
    - esm>=2.0  # ESM-1b protein language model
    - caduceus  # PlantCaduceus DNA language model (if available via pip)
