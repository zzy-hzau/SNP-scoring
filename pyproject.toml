[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phenofuncrank-paper-reproducibility"
version = "0.1.0"
description = "Modular source and real-data verification for the PhenoFuncRank paper"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "xgboost==3.2.0", "scipy>=1.11", "pyyaml>=6", "scikit-learn==1.7.2"]

[project.scripts]
phenofuncrank = "phenofuncrank_repro.cli:main"

[project.optional-dependencies]
resources = ["pysam==0.23.3", "biopython==1.87", "tqdm==4.67.3"]
upstream = ["pysam==0.23.3", "biopython==1.87", "tqdm==4.67.3", "joblib>=1.3"]
sequence-features = ["torch==2.6.0", "transformers==5.5.3", "biopython==1.87", "tqdm==4.67.3"]
interpretation-dense = ["sentence-transformers==5.7.0", "transformers==5.5.3", "requests==2.33.1", "torch==2.6.0"]
interpretation = ["pydantic==2.12.5", "openai==2.31.0"]
dpcformer = ["torch==2.6.0"]
dpcformer-training = ["torch==2.6.0", "numpy==1.26.4", "minepy==1.2.6"]
simulation-rice = ["torch==2.1.0", "numpy==1.26.4"]
manuscript-rice-allele = ["torch==2.1.0", "numpy==1.26.4"]
simulation-cotton = ["torch==2.6.0", "numpy==2.2.6"]
mic = ["numpy==1.26.4", "minepy==1.2.6"]
comparators = ["torch==2.6.0", "pysam>=0.22", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["phenofuncrank_repro*"]

[tool.setuptools.package-data]
"*" = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.txt", "**/*.md", "**/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
